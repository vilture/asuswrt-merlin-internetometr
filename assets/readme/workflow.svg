<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="wtitle wdesc">
  <title id="wtitle">How Internet-o-metr measures WAN speed</title>
  <desc id="wdesc">Shared order: server, download, upload, ping. Yandex uses CDN get-probes. iperf3 picks host and port.</desc>
  <rect width="1200" height="340" rx="26" fill="#161B1E"/>
  <rect x="1" y="1" width="1198" height="338" rx="25" fill="none" stroke="#6B8FA3" stroke-width="1.5"/>
  <text x="56" y="52" fill="#8A9BA8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2">HOW IT WORKS</text>
  <text x="56" y="92" fill="#F4F1EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700">One WebUI, two engines</text>
  <g id="steps" transform="translate(56 124)">
    <g>
      <rect width="250" height="88" rx="10" fill="#2F3A3E" stroke="#6B8FA3"/>
      <text x="20" y="36" fill="#FFCC00" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">01</text>
      <text x="20" y="64" fill="#F4F1EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Server</text>
    </g>
    <path d="M262 44 H286" stroke="#6B8FA3" stroke-width="2"/>
    <polygon points="286,38 300,44 286,50" fill="#FFCC00"/>
    <g transform="translate(312 0)">
      <rect width="250" height="88" rx="10" fill="#2F3A3E" stroke="#6B8FA3"/>
      <text x="20" y="36" fill="#FFCC00" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">02</text>
      <text x="20" y="64" fill="#F4F1EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Download</text>
    </g>
    <path d="M574 44 H598" stroke="#6B8FA3" stroke-width="2"/>
    <polygon points="598,38 612,44 598,50" fill="#FFCC00"/>
    <g transform="translate(624 0)">
      <rect width="250" height="88" rx="10" fill="#2F3A3E" stroke="#6B8FA3"/>
      <text x="20" y="36" fill="#FFCC00" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">03</text>
      <text x="20" y="64" fill="#F4F1EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Upload</text>
    </g>
    <path d="M886 44 H910" stroke="#6B8FA3" stroke-width="2"/>
    <polygon points="910,38 924,44 910,50" fill="#FFCC00"/>
    <g transform="translate(936 0)">
      <rect width="152" height="88" rx="10" fill="#2F3A3E" stroke="#6B8FA3"/>
      <text x="20" y="36" fill="#FFCC00" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">04</text>
      <text x="20" y="64" fill="#F4F1EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Ping</text>
    </g>
  </g>
  <g transform="translate(56 236)">
    <rect width="532" height="64" rx="10" fill="#2A3338" stroke="#6B8FA3"/>
    <text x="20" y="28" fill="#FFCC00" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">YANDEX</text>
    <text x="20" y="50" fill="#C5D0D6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">get-probes - CDN GET/POST - HTTP RTT</text>
    <rect x="556" width="532" height="64" rx="10" fill="#2A3338" stroke="#6B8FA3"/>
    <text x="576" y="28" fill="#7FDBDA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">IPERF3</text>
    <text x="576" y="50" fill="#C5D0D6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">region - port - iperf3 -R / upload - ICMP</text>
  </g>
</svg>
